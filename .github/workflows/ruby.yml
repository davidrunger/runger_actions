name: Run RuboCop and RSpec

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
      with:
        bundler-cache: true
    - name: Run RuboCop
      run: bin/rubocop --format clang
    - name: Run RSpec tests
      run: bin/rspec --format progress
    - name: Ensure no git diff
      run: git diff --exit-code && git diff-index --quiet --cached HEAD
    - name: Ensure "## Unreleased" is in CHANGELOG.md
      run: grep "^## Unreleased" CHANGELOG.md
    - name: Upload Code Coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        directory: tmp/simple_cov
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Check Ruby Coverage
      uses: davidrunger/check-ruby-coverage@d4a24ec6ee57cb7d202bb14a29e7f60dfe43be23 # v1.0.0
